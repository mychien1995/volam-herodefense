<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rừng Trúc · Candidate art review</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #203624;
        color: #f2e3ba;
        font:
          13px 'Segoe UI',
          sans-serif;
      }
      #review-viewport,
      #review-game {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .overlay {
        position: absolute;
        background: #183027ed;
        border: 1px solid #c1a35a;
        padding: 8px 12px;
        border-radius: 4px;
        max-width: calc(100% - 24px);
      }
      #review-title {
        top: 12px;
        left: 12px;
        pointer-events: none;
      }
      #review-controls {
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      select {
        color: #f4e8c7;
        background: #263c2c;
        border: 1px solid #a88e52;
        padding: 5px;
      }
      #review-title small {
        display: block;
        margin-top: 3px;
      }
    </style>
  </head>
  <body>
    <main id="review-viewport" aria-label="Isolated forest art review viewport">
      <div id="review-game"></div>
      <div class="overlay" id="review-title">
        <strong>Rừng Trúc · CANDIDATE ART REVIEW</strong
        ><small
          >Controlled poses · Hero sprites are scale references · No AI, damage
          or gameplay integration</small
        ><span id="review-ready" data-ready="false">Loading PNG atlases…</span>
      </div>
      <div class="overlay" id="review-controls">
        <label
          >Pose
          <select id="review-pose">
            <option>idle</option>
            <option>walk</option>
            <option>basic_attack</option>
            <option>hurt</option>
            <option>death</option>
          </select></label
        >
        <label
          >Facing
          <select id="review-direction">
            <option>down</option>
            <option>left</option>
            <option>right</option>
            <option>up</option>
          </select></label
        >
        <label
          ><input type="checkbox" id="review-independent" /> Independent
          pair</label
        >
        <button data-depth="behind">Behind bamboo</button
        ><button data-depth="front">In front</button
        ><button data-depth="reset">Reset positions</button>
        <label
          >VFX
          <select id="review-effect">
            <option value="">None</option>
          </select></label
        ><button id="review-play-effect">Play VFX</button>
        <label
          ><input type="checkbox" id="review-hold-effect" /> Hold VFX contact
          frame (controlled PNG review)</label
        >
      </div>
    </main>
    <script type="module" src="/src/forest-creep-review.ts"></script>
  </body>
</html>
