<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bắc Cái · Sprite & VFX</title>
  </head>
  <body>
    <main id="bac-cai-viewport">
      <div id="bac-cai-canvas"></div>
      <section id="review-controls" aria-label="Điều khiển demo Bắc Cái">
        <div class="identity">
          <img src="/assets/bac-cai-preview/portrait.png" alt="Bắc Cái" />
          <div>
            <strong>BẮC CÁI</strong
            ><small>Hồng Thất Công · bản duyệt sprite / VFX</small>
            <small id="boss-health">HP mẫu · 70%</small>
          </div>
        </div>
        <div class="selectors">
          <label
            >Chiêu
            <select id="skill"></select></label
          ><label
            >Hướng
            <select id="facing">
              <option value="right">Phải</option>
              <option value="down">Xuống</option>
              <option value="left">Trái</option>
              <option value="up">Lên</option>
            </select></label
          ><label
            >Kết quả
            <select id="outcome">
              <option value="success">Đúng / tách dây</option>
              <option value="failure">Sai / giữ dây</option>
            </select></label
          ><label
            >Người mẫu
            <select id="players">
              <option value="6">6</option>
              <option value="2">2</option>
              <option value="1">1 · solo</option>
            </select></label
          ><button id="pause">Dừng</button><button id="restart">↺</button
          ><label
            >Nhịp
            <select id="speed">
              <option value="0.5">½×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select></label
          ><label
            >Zoom
            <select id="zoom">
              <option value="1">1× gameplay</option>
              <option value="2">2× chi tiết</option>
            </select></label
          >
        </div>
      </section>
      <section id="review-caption" aria-label="Diễn biến">
        <strong id="phase"></strong>
        <p id="note"></p>
        <div class="timeline">
          <span id="readout"></span
          ><input
            id="timeline"
            type="range"
            min="0"
            max="4000"
            step="10"
            value="0"
            aria-label="Tua animation"
          />
        </div>
        <small
          >DEMO HÌNH ẢNH · Nhân vật/hiệu ứng thật trong Phaser · Người mẫu và
          kết quả minh họa · Chưa tích hợp combat server</small
        >
      </section>
    </main>
    <script type="module" src="/src/bac-cai-preview.ts"></script>
  </body>
</html>
