<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3D · VFX r3 · duyệt cả lượt</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111619;color:#f1e4bb;font:14px system-ui}#viewport{position:relative;width:min(100vw,1280px);aspect-ratio:16/9;margin:auto;background:#1d2427;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#top,#bottom{position:absolute;left:10px;right:10px;padding:7px 10px;background:#111c20ed;border:1px solid #a78c52;display:flex;align-items:center;gap:7px;flex-wrap:wrap}#top{top:9px}#bottom{bottom:9px}select,button,input{font:inherit;color:inherit;background:#243234;border:1px solid #8a784c;border-radius:3px;padding:4px}button{cursor:pointer}button:hover{background:#455347}label{white-space:nowrap;font-size:12px}#note{flex-basis:100%;font-size:12px;color:#cec4ac}#status{position:absolute;top:108px;left:15px;font:12px monospace;background:#102025b8;padding:5px;pointer-events:none;max-width:72%}#scrub{width:150px;padding:0}dialog{position:absolute;inset:8% 5%;max-width:none;width:90%;height:84%;margin:auto;background:#111c20f5;color:inherit;border:1px solid #c6aa6d;padding:18px;overflow:auto}dialog::backdrop{background:#0008}dialog button{float:right}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}#grid img{width:100%;image-rendering:pixelated}#grid figure{margin:0}#grid figcaption{padding:4px}#info pre{white-space:pre-wrap;font:12px/1.5 monospace}a{color:#e8cf80}@media(max-width:800px){body{font-size:11px}#top,#bottom{gap:3px;padding:3px}select,button{padding:2px}#status{top:90px;font-size:10px}#grid{grid-template-columns:repeat(2,1fr)}}
</style><main id="viewport"><canvas id="scene" width="640" height="360"></canvas>
<div id="top"><strong>VFX r3 · Cả lượt</strong><select id="item" aria-label="Mục review"></select><select id="variant" aria-label="Biến thể"></select><select id="facing" aria-label="Hướng"><option value="right">Phải</option><option value="down">Dưới</option><option value="left">Trái</option><option value="up">Trên</option></select><button id="gallery">Nền / reference</button><button id="details">Tags / bàn giao</button><div id="note">Đang tải asset…</div></div>
<div id="status"></div><div id="bottom"><button id="cast">A · Trình một lượt</button><button id="pause">Space · Dừng</button><button id="prev">− frame</button><button id="next">+ frame</button><input id="scrub" type="range" min="0" max="4000" value="0" aria-label="Timeline"><select id="speed" aria-label="Tốc review"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="2">2×</option></select><label><input id="baseline" type="checkbox">Baseline</label><label><input id="body" type="checkbox" checked>Body</label><label><input id="vfx" type="checkbox" checked>VFX</label><label><input id="loop" type="checkbox">Lặp chủ động</label><button id="hold">Hold</button><button id="release">Release</button><button id="cancel">Cancel</button><button id="death">Chết</button><button id="zone">Đổi vùng</button></div>
<dialog id="boards"><button id="close-board">Đóng · ESC</button><p>Nền concept mới · thứ tự đã chốt. Chu Bá Thông giữ bản cũ.</p><div id="grid"></div><p>Khung nét liền: footprint mới = 80% rộng × 80% cao; nét đứt: cũ. Chỉ overlay đo, không đổi zoom/sprite/collision. Concept nền chưa phải tilemap sản xuất.</p></dialog>
<dialog id="info"><button id="close-info">Đóng · ESC</button><pre id="info-text"></pre></dialog>
<script type="module" src="viewer.js"></script></main></html>
