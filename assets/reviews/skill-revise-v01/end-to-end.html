<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Skill revise v03 · Xem trọn chiêu</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#111b23;color:#f3ead6;font:14px system-ui}#viewport{position:relative;width:1366px;max-width:100vw;margin:auto;aspect-ratio:1366/768;overflow:hidden}canvas{display:block;width:100%;height:auto}header,footer{position:absolute;left:12px;right:12px;background:#14232bea;border:1px solid #9f8959;border-radius:5px;padding:9px 12px}header{top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}footer{bottom:10px;display:grid;gap:5px}select,button,a{font:inherit;color:inherit;background:#293b40;border:1px solid #9a865a;border-radius:3px;padding:5px 8px}select{max-width:310px}button{cursor:pointer}button:hover{background:#435953}#progress{width:100%;accent-color:#d6b65b}#phase{color:#ffe298;font-weight:bold}small{color:#d3c6a5}a{font-size:12px;text-decoration:none;margin-left:auto}@media(max-width:800px){header{font-size:11px;gap:4px;padding:5px}select,button{padding:3px}select{max-width:220px}footer{font-size:11px;padding:5px}}</style>
