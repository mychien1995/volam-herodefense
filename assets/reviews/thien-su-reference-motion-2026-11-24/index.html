<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thiền Sư · Mô phỏng theo ảnh mẫu</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#111b23;color:#f3ead6;font:14px system-ui}main{position:relative;width:1366px;max-width:100vw;margin:auto;aspect-ratio:1366/768;overflow:hidden}canvas{display:block;width:100%;height:auto}header,footer{position:absolute;left:12px;right:12px;background:#14232bf2;border:1px solid #9f8959;border-radius:5px;padding:10px 12px}header{top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}footer{bottom:10px;display:grid;gap:9px}select,button{font:inherit;color:inherit;background:#293b40;border:1px solid #9a865a;border-radius:3px;padding:6px 9px}button{cursor:pointer}button[aria-pressed=true]{background:#715d36}#progress{width:100%;accent-color:#d6b65b}#phase{color:#ffe298;font-weight:bold}#poses{display:flex;gap:6px;flex-wrap:wrap}small{color:#d3c6a5}</style>
<main><div id="canvas"></div><header><strong>Thiền Sư · Chuỗi động tác theo ảnh mẫu</strong><button id="play">Tạm dừng</button><button id="restart">Phát lại</button><select id="speed" aria-label="Tốc độ"><option value="1">1×</option><option value="0.5">Chậm 0,5×</option><option value="0.25">Chậm 0,25×</option></select><select id="zoom" aria-label="Kích thước xem"><option value="3">Phóng lớn xem tay cầm</option><option value="1.5">Phóng vừa</option><option value="0.5">Kích thước gameplay</option></select><label><input id="repeat" type="checkbox" checked>Lặp chuỗi</label></header><footer><div><span id="phase">Đang tải…</span> · <span id="clock"></span></div><input id="progress" aria-label="Vị trí chuyển động" type="range" min="0" max="1000" value="0"><div id="poses"></div><small>Mẫu chuyển động một hướng để duyệt. Chưa thay animation trong game. Chuỗi kết thúc ở chạm đất; phát lại từ đầu sau nhịp nghỉ.</small></footer></main>
<script src="/phaser.js"></script><script type="module" src="/motion.js"></script></html>
